        }
        ::view-transition-new(*) {

            <h2 id="6-user-experience-flow">6. User Experience Flow</h2>
            <h3 id="from-upload-to-answerable-query">From upload to answerable query</h3>
            <ol>
              <li>Open the Library.</li>
              <li>Drop or select a PDF.</li>
              <li>Wait for conversion and indexing.</li>
              <li>Search in the global search dialog.</li>
              <li>View excerpts with page and provenance metadata.</li>
              <li>Open the reader and navigate to relevant pages.</li>
            </ol>
            <h3 id="security-model">Security model</h3>
            <ul>
              <li>every chunk and PDF is scoped to the authenticated user,</li>
              <li>Supabase RLS prevents cross-user access,</li>
              <li>FastAPI derives ownership from verified auth tokens.</li>
            </ul>
          </section>

            <h2 id="7-what-changed-in-phase-1">7. What Changed in Phase 1</h2>
            <h3 id="upload-workflow-improvement">Upload workflow improvement</h3>
            <ul>
              <li><code>isUploading</code> was moved to cover only the transfer phase.</li>
              <li>Indexing runs independently per file.</li>
              <li>Multiple uploads can proceed without one blocking the other.</li>
            </ul>
            <h3 id="search-deduplication-fix">Search deduplication fix</h3>
            <ul>
              <li>candidate pool increased before final slicing,</li>
              <li>exact normalized duplicates were removed,</li>
              <li>shared-prefix passages were preserved correctly,</li>
              <li>top results remained non-duplicate and count-correct.</li>
            </ul>
            <h3 id="result">Result</h3>
            <ul>
              <li>smoother UX for parallel uploads,</li>
              <li>better result correctness in top rankings,</li>
              <li>stronger engineering stability without changing the core product goal.</li>
