<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="450" y="38" text-anchor="middle" font-size="28" font-family="Segoe UI, Arial" font-weight="700" fill="#0f172a">Roadmap</text>

  <line x1="80" y1="250" x2="820" y2="250" stroke="#94a3b8" stroke-width="4"/>

  <g>
    <circle cx="120" cy="250" r="14" fill="#2563eb"/>
    <text x="120" y="220" text-anchor="middle" font-size="15" font-family="Segoe UI, Arial" fill="#0f172a">Phase 1</text>
    <text x="120" y="290" text-anchor="middle" font-size="13" font-family="Segoe UI, Arial" fill="#475569">Complete</text>

    <circle cx="300" cy="250" r="14" fill="#16a34a"/>
    <text x="300" y="220" text-anchor="middle" font-size="15" font-family="Segoe UI, Arial" fill="#0f172a">Book test</text>
    <text x="300" y="290" text-anchor="middle" font-size="13" font-family="Segoe UI, Arial" fill="#475569">Short-term</text>

    <circle cx="500" cy="250" r="14" fill="#d97706"/>
    <text x="500" y="220" text-anchor="middle" font-size="15" font-family="Segoe UI, Arial" fill="#0f172a">Highlights</text>
    <text x="500" y="290" text-anchor="middle" font-size="13" font-family="Segoe UI, Arial" fill="#475569">Medium</text>

    <circle cx="700" cy="250" r="14" fill="#7c3aed"/>
    <text x="700" y="220" text-anchor="middle" font-size="15" font-family="Segoe UI, Arial" fill="#0f172a">CI + scale</text>
    <text x="700" y="290" text-anchor="middle" font-size="13" font-family="Segoe UI, Arial" fill="#475569">Long-term</text>
  </g>

  <g>
    <text x="120" y="330" text-anchor="middle" font-size="12" font-family="Segoe UI, Arial" fill="#475569">2023-10</text>
    <text x="300" y="330" text-anchor="middle" font-size="12" font-family="Segoe UI, Arial" fill="#475569">2024-10</text>
    <text x="500" y="330" text-anchor="middle" font-size="12" font-family="Segoe UI, Arial" fill="#475569">2024-11</text>
    <text x="700" y="330" text-anchor="middle" font-size="12" font-family="Segoe UI, Arial" fill="#475569">2025-01</text>
  </g>
